<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SYNCBOUND</title>
<style>*{box-sizing:border-box}body{margin:0;background:#080b12;color:#eef3ff;font-family:system-ui;overflow:hidden}canvas{display:block;width:100vw;height:100vh}.hud{position:fixed;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;padding:14px 18px;font-weight:800;text-shadow:0 2px 8px #000}.p1{color:#58b9ff}.p2{color:#ff986c}.hp{font-size:12px;opacity:.9}.msg{position:absolute;top:58px;left:50%;transform:translateX(-50%);padding:9px 14px;background:#101a2ddd;border:1px solid #ffffff25;border-radius:10px;opacity:0;transition:.2s}.menu{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle,#263b62,#080b12 72%);text-align:center}.panel{width:min(700px,92vw);padding:38px;border-radius:24px;background:#0c1220ee;border:1px solid #ffffff25}.panel h1{font-size:clamp(42px,8vw,78px);margin:0;letter-spacing:5px}.panel p{color:#b7c4d9;line-height:1.5}.panel button{padding:14px 24px;border:0;border-radius:12px;font-size:17px;font-weight:800;cursor:pointer}.small{font-size:13px;color:#8795ad}</style></head><body>
<canvas id="c"></canvas><div class="hud"><div class="top"><span><span class="p1">P1</span> WASD <span class="hp" id="h1"></span></span><span id="lv">ROOM 1 / 8</span><span><span class="p2">P2</span> ARROWS <span class="hp" id="h2"></span></span></div><div class="msg" id="msg"></div></div>
<div class="menu" id="menu"><div class="panel"><h1 id="title">SYNCBOUND</h1><p id="desc">An experimental facility built for two. Push crates, survive hazards, activate both locks, and escape together.</p><p><b class="p1">P1:</b> WASD &nbsp; <b class="p2">P2:</b> Arrow Keys</p><p>Push <b>crates</b> by walking into them. Red hazards damage you. Reach the glowing exit together.</p><button id="start">START CO-OP</button><p class="small">R restart room • ESC pause</p></div></div>
<script>
const c=document.getElementById('c'),g=c.getContext('2d');
// Original procedural soundtrack: no external audio files needed.
let audioCtx=null, master=null, musicTimer=null, musicStep=0;
const chords=[[65.41,77.78,98],[58.27,69.30,87.31],[73.42,87.31,110],[55,65.41,82.41]];
function startMusic(){
  if(audioCtx){if(audioCtx.state==='suspended')audioCtx.resume();return}
  audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  master=audioCtx.createGain();master.gain.value=.055;master.connect(audioCtx.destination);
  musicStep=0;
  musicTimer=setInterval(playMusicStep,500);
  playMusicStep();
}
function tone(freq,dur=.42,type='sine',gain=.025){
  if(!audioCtx)return;
  const o=audioCtx.createOscillator(), a=audioCtx.createGain();
  o.type=type;o.frequency.value=freq;a.gain.setValueAtTime(.0001,audioCtx.currentTime);
  a.gain.exponentialRampToValueAtTime(gain,audioCtx.currentTime+.025);
  a.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur);
  o.connect(a);a.connect(master);o.start();o.stop(audioCtx.currentTime+dur+.03);
}
function playMusicStep(){
  if(!running||paused)return;
  const chord=chords[Math.floor(musicStep/4)%chords.length], beat=musicStep%4;
  tone(chord[beat%3],.46,'triangle',.018);
  if(beat===0)tone(chord[0]/2,.8,'sine',.022);
  if(beat===2)tone(chord[1]*2,.22,'sine',.012);
  musicStep++;
}
function sfx(freq,type='square',gain=.035,dur=.09){tone(freq,dur,type,gain)}
let W,H,keys={},running=false,paused=false,room=0,cam={x:0,y:0},toastTimer=0;
const rooms=[
{w:1900,h:950,s:[[120,800],[230,800]],e:[1740,120],pads:[[520,760],[520,170]],walls:[[0,850,1900,100],[0,0,55,950],[1845,0,55,950],[760,350,55,500],[1200,0,55,500],[1500,350,55,500]],cr:[[370,760]],haz:[],drones:[]},
{w:2100,h:1050,s:[[120,900],[250,900]],e:[1920,110],pads:[[520,820],[1580,250]],walls:[[0,950,2100,100],[0,0,55,1050],[2045,0,55,1050],[680,550,55,400],[1020,0,55,700],[1400,550,55,400]],cr:[[480,820],[850,820]],haz:[[1120,820,220,45]],drones:[]},
{w:2200,h:1100,s:[[120,950],[250,950]],e:[2040,120],pads:[[530,850],[1700,850]],walls:[[0,1000,2200,100],[0,0,55,1100],[2145,0,55,1100],[700,650,55,350],[1100,250,55,750],[1500,650,55,350],[1850,250,55,750]],cr:[[500,850],[850,850],[1250,850]],haz:[[730,780,300,45]],drones:[[1300,500]]},
{w:2300,h:1150,s:[[130,1000],[280,1000]],e:[2140,120],pads:[[550,900],[1750,300]],walls:[[0,1050,2300,100],[0,0,55,1150],[2245,0,55,1150],[420,700,55,350],[800,250,55,800],[1200,700,55,350],[1550,250,55,800],[1950,700,55,350]],cr:[[620,900],[980,900],[1350,900]],haz:[[1250,820,230,45]],drones:[[1000,500],[1800,500]]},
{w:2450,h:1200,s:[[130,1050],[290,1050]],e:[2290,120],pads:[[520,950],[1950,300]],walls:[[0,1100,2450,100],[0,0,55,1200],[2395,0,55,1200],[400,750,55,350],[760,350,55,750],[1120,750,55,350],[1480,350,55,750],[1840,750,55,350],[2160,350,55,750]],cr:[[560,950],[900,950],[1280,950],[1650,950]],haz:[[1200,850,220,45]],drones:[[900,520],[1700,520]]},
{w:2600,h:1250,s:[[130,1100],[290,1100]],e:[2440,120],pads:[[550,980],[2050,250]],walls:[[0,1150,2600,100],[0,0,55,1250],[2545,0,55,1250],[430,750,55,400],[800,300,55,850],[1180,750,55,400],[1550,300,55,850],[1920,750,55,400],[2260,300,55,850]],cr:[[570,980],[980,980],[1370,980],[1750,980]],haz:[[1240,880,250,45],[2000,700,160,45]],drones:[[1050,500],[1800,500]]},
{w:2750,h:1300,s:[[130,1150],[300,1150]],e:[2590,120],pads:[[560,1030],[2210,260]],walls:[[0,1200,2750,100],[0,0,55,1300],[2695,0,55,1300],[430,780,55,420],[800,300,55,900],[1180,780,55,420],[1560,300,55,900],[1940,780,55,420],[2300,300,55,900]],cr:[[600,1030],[980,1030],[1360,1030],[1740,1030],[2110,1030]],haz:[[1220,930,260,45],[2050,850,190,45]],drones:[[1000,540],[1750,540],[2350,540]]},
{w:3000,h:1400,s:[[130,1250],[300,1250]],e:[2840,120],pads:[[600,1120],[2400,260]],walls:[[0,1300,3000,100],[0,0,55,1400],[2945,0,55,1400],[430,850,55,450],[800,300,55,1000],[1180,850,55,450],[1560,300,55,1000],[1940,850,55,450],[2320,300,55,1000],[2700,850,55,450]],cr:[[600,1120],[980,1120],[1360,1120],[1740,1120],[2120,1120],[2500,1120]],haz:[[1220,1010,260,45],[2050,920,210,45],[2600,700,150,45]],drones:[[1000,550],[1750,550],[2450,550],[2700,950]]}
];
let P=[],crates=[],drones=[],particles=[];
function roomData(){return rooms[room]}
function reset(){let l=roomData();P=[newPlayer(0),newPlayer(1)];crates=l.cr.map(q=>({x:q[0],y:q[1],r:27,vx:0,vy:0}));drones=l.drones.map(q=>({x:q[0],y:q[1],r:18,hp:3,t:0}));cam={x:0,y:0};document.getElementById('lv').textContent='ROOM '+(room+1)+' / '+rooms.length;toast(room===0?'Push the crate onto the first pad.':'New room: use the crates and avoid the hazards.')}
function newPlayer(i){let q=roomData().s[i];return{x:q[0],y:q[1],r:21,vx:0,vy:0,hp:5,c:i?'#ff986c':'#58b9ff',cool:0}}
function toast(t){let m=document.getElementById('msg');m.textContent=t;m.style.opacity=1;clearTimeout(toastTimer);toastTimer=setTimeout(()=>m.style.opacity=0,1800)}
function hit(a,r){return a.x+a.r>r[0]&&a.x-a.r<r[0]+r[2]&&a.y+a.r>r[1]&&a.y-a.r<r[1]+r[3]}
function circleRect(o,r){let nx=Math.max(r[0],Math.min(o.x,r[0]+r[2])),ny=Math.max(r[1],Math.min(o.y,r[1]+r[3]));return Math.hypot(o.x-nx,o.y-ny)<o.r}
function solid(o){let l=roomData();return l.walls.some(r=>circleRect(o,r))}
function tryMove(p,dx,dy){let oldx=p.x,oldy=p.y;p.x+=dx;if(solid(p)){p.x=oldx;pushCrates(p,dx,0)}p.y+=dy;if(solid(p)){p.y=oldy;pushCrates(p,0,dy)}p.x=Math.max(55+p.r,Math.min(roomData().w-55-p.r,p.x));p.y=Math.max(p.r,Math.min(roomData().h-100-p.r,p.y))}
function pushCrates(p,dx,dy){for(const b of crates){let d=Math.hypot(p.x-b.x,p.y-b.y);if(d<p.r+b.r+5){let nx=dx,ny=dy,len=Math.hypot(nx,ny)||1;nx/=len;ny/=len;let tx=b.x+nx*4.5,ty=b.y+ny*4.5,test={...b,x:tx,y:ty};if(!solid(test)&&!crates.some(o=>o!==b&&Math.hypot(o.x-tx,o.y-ty)<o.r+b.r+2)){b.x=tx;b.y=ty;}}}}
function update(){if(!running||paused)return;let l=roomData(), binds=[['a','d','w','s'],['ArrowLeft','ArrowRight','ArrowUp','ArrowDown']];P.forEach((p,i)=>{if(p.hp<=0)return;let k=binds[i],ax=(keys[k[1]]?1:0)-(keys[k[0]]?1:0),ay=(keys[k[3]]?1:0)-(keys[k[2]]?1:0),len=Math.hypot(ax,ay)||1;tryMove(p,ax/len*4.2,ay/len*4.2);p.cool=Math.max(0,p.cool-1)});
crates.forEach(b=>{b.x+=b.vx;b.y+=b.vy;b.vx*=.82;b.vy*=.82});
l.haz.forEach(r=>P.forEach(p=>{if(hit(p,r)&&p.cool===0&&p.hp>0){p.hp--;p.cool=45;toast('Ouch! Hazard damage — HP '+p.hp);if(p.hp<=0){toast('A player is down. Restarting room...');setTimeout(reset,900)}}}));
drones.forEach(d=>{d.t++;let target=P.reduce((a,b)=>Math.hypot(a.x-d.x,a.y-d.y)<Math.hypot(b.x-d.x,b.y-d.y)?a:b);let dx=target.x-d.x,dy=target.y-d.y,len=Math.hypot(dx,dy)||1;d.x+=dx/len*1.15;d.y+=dy/len*1.15;if(Math.hypot(target.x-d.x,target.y-d.y)<42&&d.t%45===0&&target.cool===0){target.hp--;target.cool=25;toast('Drone hit! HP '+target.hp);if(target.hp<=0)setTimeout(reset,700)}});
let pad=l.pads.map(q=>crates.some(b=>Math.hypot(b.x-q[0],b.y-q[1])<48)||P.some(p=>Math.hypot(p.x-q[0],p.y-q[1])<45));let both=pad[0]&&pad[1];if(both&&Math.random()<.02)toast('BOTH LOCKS ACTIVE — find the exit!');
let ex=P.every(p=>Math.hypot(p.x-l.e[0],p.y-l.e[1])<95);if(ex&&both){room++;if(room<rooms.length)reset();else{running=false;document.getElementById('menu').style.display='grid';document.getElementById('title').textContent='FACILITY ESCAPED';document.getElementById('desc').textContent='You cleared all 8 rooms. Two players, one escape.';document.getElementById('start').textContent='PLAY AGAIN';room=0}}
cam.x+=(Math.max(P[0].x,P[1].x)-W/2-cam.x)*.08;cam.y+=(Math.max(P[0].y,P[1].y)-H/2-cam.y)*.08;cam.x=Math.max(0,Math.min(l.w-W,cam.x));cam.y=Math.max(0,Math.min(l.h-H,cam.y));document.getElementById('h1').textContent='HP '+P[0].hp;document.getElementById('h2').textContent='HP '+P[1].hp}
function draw(){W=c.width=innerWidth;H=c.height=innerHeight;g.clearRect(0,0,W,H);let l=roomData();g.save();g.translate(-cam.x,-cam.y);g.fillStyle='#0b111c';g.fillRect(0,0,l.w,l.h);for(let i=0;i<l.w;i+=80){g.strokeStyle='#ffffff07';g.beginPath();g.moveTo(i,0);g.lineTo(i,l.h);g.stroke()}for(let j=0;j<l.h;j+=80){g.strokeStyle='#ffffff07';g.beginPath();g.moveTo(0,j);g.lineTo(l.w,j);g.stroke()}l.walls.forEach(r=>{g.fillStyle='#27344a';g.fillRect(...r);g.strokeStyle='#627a9e';g.strokeRect(...r)});l.haz.forEach(r=>{g.fillStyle='#d34b4b';g.fillRect(...r);for(let z=r[0];z<r[0]+r[2];z+=20){g.fillStyle='#ffb34d';g.fillRect(z,r[1],10,r[3])}});l.pads.forEach((q,i)=>{let active=crates.some(b=>Math.hypot(b.x-q[0],b.y-q[1])<48)||P.some(p=>Math.hypot(p.x-q[0],p.y-q[1])<45);g.beginPath();g.arc(q[0],q[1],45,0,7);g.fillStyle=active?'#54e49a':'#25384e';g.fill();g.strokeStyle=i?'#ff986c':'#58b9ff';g.lineWidth=5;g.stroke()});crates.forEach(b=>{g.fillStyle='#b28a55';g.fillRect(b.x-27,b.y-27,54,54);g.strokeStyle='#f2c77d';g.strokeRect(b.x-27,b.y-27,54,54);g.fillStyle='#6e5130';g.fillRect(b.x-7,b.y-7,14,14)});drones.forEach(d=>{g.fillStyle='#f05b65';g.beginPath();g.arc(d.x,d.y,d.r,0,7);g.fill();g.fillStyle='#fff';g.fillRect(d.x-6,d.y-3,4,5);g.fillRect(d.x+2,d.y-3,4,5)});g.beginPath();g.arc(l.e[0],l.e[1],72,0,7);g.fillStyle=l.pads.every(q=>crates.some(b=>Math.hypot(b.x-q[0],b.y-q[1])<48)||P.some(p=>Math.hypot(p.x-q[0],p.y-q[1])<45))?'#55e6a0':'#172333';g.fill();g.strokeStyle='#dceaff';g.lineWidth=4;g.stroke();g.fillStyle='#fff';g.font='bold 16px system-ui';g.textAlign='center';g.fillText('EXIT',l.e[0],l.e[1]+6);P.forEach((p,i)=>{if(p.hp<=0)return;g.shadowBlur=18;g.shadowColor=p.c;g.fillStyle=p.c;g.beginPath();g.arc(p.x,p.y,p.r,0,7);g.fill();g.shadowBlur=0;g.fillStyle='#07101b';g.font='bold 12px system-ui';g.fillText(i?'2':'1',p.x,p.y+4)});g.restore();if(paused){g.fillStyle='#000a';g.fillRect(0,0,W,H);g.fillStyle='#fff';g.font='bold 42px system-ui';g.textAlign='center';g.fillText('PAUSED',W/2,H/2)}requestAnimationFrame(loop)}
function loop(){update();draw()}addEventListener('keydown',e=>{keys[e.key]=true;if(e.key.toLowerCase()==='r'&&running){reset();sfx(180,'square',.035,.12)}if(e.key==='Escape'&&running){paused=!paused;sfx(paused?130:260,'triangle',.03,.12)}});addEventListener('keyup',e=>keys[e.key]=false);document.getElementById('start').onclick=()=>{startMusic();document.getElementById('menu').style.display='none';running=true;paused=false;reset();sfx(220,'triangle',.05,.25)};addEventListener('resize',draw);reset();loop();
</script></body></html>
