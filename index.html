<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Doodle Jump</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#dff6ff;font-family:system-ui}canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:12px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;font-weight:900;font-size:20px;color:#17324d;text-shadow:0 2px #fff;pointer-events:none}
#menu{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(#bdeeffcc,#fff8);text-align:center}
.panel{background:#fff;padding:30px;border:4px solid #17324d;border-radius:22px;box-shadow:0 10px 0 #17324d;width:min(520px,90vw)}
h1{font-size:clamp(48px,10vw,82px);margin:0;color:#55a85b;letter-spacing:2px}p{color:#40566b}.panel button{font:inherit;font-weight:900;font-size:20px;padding:14px 28px;border:3px solid #17324d;border-radius:14px;background:#ffd34d;cursor:pointer}
.small{font-size:13px}
</style></head><body>
<canvas id="game"></canvas><div id="hud"><span>⭐ <b id="score">0</b></span><span>🏆 <b id="best">0</b></span></div>
<div id="menu"><div class="panel"><h1>DOODLE JUMP</h1><p>Jump automatically, land on platforms, and climb as high as you can.</p><p><b>← →</b> or <b>A D</b> to move</p><button id="start">PLAY</button><p class="small">Land on platforms to keep bouncing. Don't fall!</p></div></div>
<script>
const c=document.getElementById('game'),x=c.getContext('2d');let W,H,player,plats=[],score=0,best=Number(localStorage.doodleBest||0),running=false,gameOver=false,keys={},cam=0;
function resize(){W=c.width=innerWidth;H=c.height=innerHeight}addEventListener('resize',resize);resize();document.getElementById('best').textContent=best;
function reset(){
 score=0;cam=0;gameOver=false;
 player={x:W/2,y:H-130,w:42,h:52,vx:0,vy:-11};
 plats=[];
 let y=H-55;
 for(let i=0;i<14;i++){plats.push({x:Math.random()*(W-110),y,w:110,h:14});y-=55+Math.random()*35}
 plats[0].x=W/2-55;
 document.getElementById('score').textContent=0;
}
function start(){document.getElementById('menu').style.display='none';running=true;reset()}
function newPlatforms(){while(plats.length&&plats[0].y>cam+H+100)plats.shift();let top=Math.min(...plats.map(p=>p.y));while(top>cam-100){top-=55+Math.random()*45;let width=85+Math.random()*55;plats.push({x:Math.random()*(W-width),y:top,w:width,h:14})}}
function update(){
 if(!running||gameOver)return;
 const left=keys.ArrowLeft||keys.a,right=keys.ArrowRight||keys.d;
 player.vx+=(right?0.7:0)-(left?0.7:0);player.vx*=.88;player.vx=Math.max(-6,Math.min(6,player.vx));player.x+=player.vx;
 if(player.x<-player.w)player.x=W;if(player.x>W)player.x=-player.w;
 const oldBottom=player.y+player.h;player.vy+=.42;player.y+=player.vy;
 if(player.vy>0)for(const p of plats)if(oldBottom<=p.y&&player.y+player.h>=p.y&&player.x+player.w>p.x&&player.x<p.x+p.w){player.y=p.y-player.h;player.vy=-11.5;score++;document.getElementById('score').textContent=score;if(score>best){best=score;localStorage.doodleBest=best;document.getElementById('best').textContent=best}}
 const target=H*.38;if(player.y<target){let d=target-player.y;player.y=target;cam-=d;plats.forEach(p=>p.y+=d)}
 newPlatforms();
 if(player.y>H+80){gameOver=true;running=false;document.getElementById('menu').style.display='grid';document.querySelector('#menu h1').textContent='GAME OVER';document.querySelector('#menu p').textContent='Score: '+score+' · Best: '+best;document.getElementById('start').textContent='PLAY AGAIN'}
}
function draw(){
 if(!player)return;
 x.clearRect(0,0,W,H);
 let grd=x.createLinearGradient(0,0,0,H);grd.addColorStop(0,'#9fe4ff');grd.addColorStop(1,'#f8fdff');x.fillStyle=grd;x.fillRect(0,0,W,H);
 // clouds
 x.fillStyle='#ffffffaa';for(let i=0;i<7;i++){let cx=(i*190-(cam*.18))%(W+220)-80,cy=100+(i%4)*150;x.beginPath();x.arc(cx,cy,28,0,7);x.arc(cx+30,cy-12,36,0,7);x.arc(cx+65,cy,25,0,7);x.fill()}
 plats.forEach(p=>{x.fillStyle='#55a85b';x.beginPath();if(x.roundRect)x.roundRect(p.x,p.y,p.w,p.h,7);else x.rect(p.x,p.y,p.w,p.h);x.fill();x.fillStyle='#2e6f39';x.fillRect(p.x,p.y+p.h-4,p.w,4)});
 // doodle character
 x.save();x.translate(player.x,player.y);x.strokeStyle='#17324d';x.lineWidth=4;x.fillStyle='#ffd34d';x.beginPath();x.ellipse(player.w/2,player.h/2,player.w/2-3,player.h/2-3,0,0,7);x.fill();x.stroke();
 x.fillStyle='#17324d';x.beginPath();x.arc(13,18,4,0,7);x.arc(29,18,4,0,7);x.fill();x.beginPath();x.arc(21,29,9,0,Math.PI);x.stroke();x.restore();
}
function loop(){update();draw();requestAnimationFrame(loop)}
addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault()});addEventListener('keyup',e=>keys[e.key]=false);
document.getElementById('start').onclick=start;reset();loop();
</script></body></html>
